# FieldMap for Session A's PROVISIONAL step0_rules/schema/v0_provisional.json and data/draft/cases.jsonl.
# Test/harness config only; when Tianle sets the real schema, write a new one of these.
decision_path: decision
decision_labels: [approve, reject, escalate]
escalate_label: escalate
screening_path: screening
screening_id_key: hit_id
screening_label_key: disposition
screening_labels: [true_match, false_positive, needs_review]
identity_fields:
  verified: identity.verified
  name: identity.name.status
  date_of_birth: identity.date_of_birth.status
  document_number: identity.document_number.status
  expiry: identity.expiry.status
  address: identity.address.status
risk_path: risk_tier
risk_labels: [low, medium, high]
actions_path: required_actions
narrative_path: narrative
narrative_sentence_key: sentence
narrative_refs_key: evidence_refs
adversarial_subsets:
  injection: [prompt_injection]
  ambiguous: [insufficient_evidence]
gold_id_key: case_id
gold_expected_key: expected
gold_tags_key: scenarios
gold_packet_key: packet
# Section ids that actually occur in this packet (CTX, APP, ID, MRZ, POA, SCR, H1..Hn).
packet_ref_id_regex: '\b(CTX|APP|ID|MRZ|POA|SCR|H\d+)\b'
